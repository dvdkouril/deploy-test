name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: cerit.io/kouril1/deploy-test

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Harbor (cerit.io)
        uses: docker/login-action@v3
        with:
          registry: cerit.io
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_CLI_SECRET }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: APP_VERSION=${{ github.sha }}

      - name: Configure kubectl
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy
        run: |
          cd k8s
          kustomize edit set image "${IMAGE_NAME}=${IMAGE_NAME}:${GITHUB_SHA}"
          kubectl apply -k .
          kubectl rollout status deployment/deploy-test -n kouril1-ns --timeout=180s
