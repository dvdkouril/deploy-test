apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-test
  labels:
    app: deploy-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deploy-test
  template:
    metadata:
      labels:
        app: deploy-test
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: cerit.io/dvdkouril/deploy-test
          ports:
            - containerPort: 8080
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: deploy-test-svc
spec:
  type: ClusterIP
  selector:
    app: deploy-test
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deploy-test-ingress
  annotations:
    kubernetes.io/ingress.class: nginx-traefik
    cert-manager.io/cluster-issuer: letsencrypt-gateway
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx-traefik
  tls:
    - hosts:
        - deploy-test-kouril1.dyn.cloud.e-infra.cz
      secretName: deploy-test-tls
  rules:
    - host: deploy-test-kouril1.dyn.cloud.e-infra.cz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deploy-test-svc
                port:
                  number: 80
